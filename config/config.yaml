# Pipeline configuration. Everything environment-specific lives here, nothing in code.
# Point FALCON_CONFIG at another file (or pass --config) to run somewhere else.

spark:
  # databricks_connect: run from a laptop against Databricks (auth from ~/.databrickscfg)
  # cluster:            already inside a Spark/Databricks job, use the active session
  mode: databricks_connect
  databricks_profile: DEFAULT   # profile name in ~/.databrickscfg (no secrets here)
  serverless: true              # false -> set cluster_id
  cluster_id: null
  session_conf:
    spark.sql.session.timeZone: UTC

input:
  # Folder that contains dt=YYYY-MM-DD/ day folders
  base_path: /Volumes/workspace/falcon/raw/dataset

warehouse:
  catalog: workspace
  schema: falcon
  format: delta

external:
  # Exchange rates (ECB via frankfurter, no key needed). Fetched once by code into ref_fx_rates.
  fx_url: https://api.frankfurter.dev/v1
  fx_base: USD
  fx_lookback_days: 10        # fetch from first_date - N so the first days have a previous rate
  http_timeout_s: 30
  refresh: false              # true = fetch again even if the reference tables already cover the range
  # Public holidays come from the `holidays` Python package (no network), into ref_holidays.

run:
  first_date: "2026-08-24"
  last_date: "2026-10-25"
